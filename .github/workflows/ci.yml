name: CI

# The test suite, run in two places:
#   • on every pull request (fast feedback before merge), and
#   • as a reusable workflow (workflow_call) from deploy.yml, where it GATES
#     the production deploy — the deploy job requires it, so a regression on
#     main blocks the deploy.
#
# Jobs:
#   unit — type-check, then `turbo run test`, which fans out across every
#          workspace: the UI kit's Vitest suite (jsdom) and each package's own
#          node-environment suite (manifest, i18n parity, route table, SEO).
#   e2e  — the site's Playwright suite against its real static build
#          (`astro preview`). There is no backend to configure, by construction.

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run the site's e2e suite
        run: npm run test:e2e

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/site/playwright-report/
          retention-days: 14
